$kind: http-request
url: "{{baseUrl}}/api/characters/{{tonyId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "description": "Updated through the protected character endpoint."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Update returns 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Updated description is returned', function () {
        pm.expect(pm.response.json().character.description).to.eql('Updated through the protected character endpoint.');
      });
    language: text/javascript
order: 10000
