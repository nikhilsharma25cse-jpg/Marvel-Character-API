$kind: http-request
url: "{{baseUrl}}/api/characters"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Character list returns 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response contains a characters array', function () {
        pm.expect(pm.response.json().characters).to.be.an('array');
      });
    language: text/javascript
order: 5000
